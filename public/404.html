<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-69T9E59SM7');

<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>nocturne</title>
    <style>html,body{background:#05060d;color:#eae6ff;margin:0}</style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230b0a14'/><circle cx='16' cy='16' r='9' fill='%23c9c1ff'/><circle cx='21' cy='14' r='8' fill='%230b0a14'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/dock.css">
    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }
        canvas#bgCanvas { position: fixed; inset: 0; z-index: 0; }

        .wrap {
            position: relative;
            z-index: 1;
            max-width: 540px;
            width: 100%;
            text-align: center;
            opacity: 0;
            animation: rise 0.55s var(--ease) 0.05s forwards;
        }
        @keyframes rise {
            from { opacity: 0; transform: translateY(10px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .code {
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 96px;
            font-weight: 500;
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--accent);
            margin: 0 0 10px;
            text-shadow: 0 0 36px rgba(184, 176, 218, 0.18);
        }
        h1 {
            font-size: 20px;
            font-weight: 600;
            color: var(--fg);
            letter-spacing: -0.01em;
            margin: 0 0 10px;
        }
        p {
            font-size: 13.5px;
            color: var(--fg-3);
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .path {
            display: inline-block;
            margin-top: 12px;
            padding: 5px 10px;
            border-radius: 6px;
            background: rgba(20, 22, 38, 0.55);
            border: 1px solid var(--line-2);
            font-family: 'JetBrains Mono', ui-monospace, monospace;
            font-size: 11.5px;
            color: var(--fg-2);
            max-width: 100%;
            overflow-wrap: anywhere;
        }
        .actions {
            display: flex;
            gap: 8px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 22px;
        }
        .btn {
            padding: 9px 16px;
            border-radius: 7px;
            font-size: 12.5px;
            font-weight: 500;
            text-decoration: none;
            border: 1px solid var(--line-2);
            color: var(--fg-2);
            background: rgba(20, 22, 38, 0.4);
            transition: background 0.15s, border-color 0.15s, color 0.15s, transform 0.1s;
            cursor: pointer;
        }
        .btn:hover {
            background: rgba(40, 42, 58, 0.6);
            color: var(--fg);
            border-color: var(--line-3);
        }
        .btn:active { transform: translateY(1px); }
        .btn.primary {
            background: var(--fg);
            color: var(--bg);
            border-color: var(--fg);
        }
        .btn.primary:hover { background: var(--accent); border-color: var(--accent); }

        @media (max-width: 480px) {
            .code { font-size: 72px; }
            h1 { font-size: 17px; }
        }
    </style>
</head>
<body>

<canvas id="bgCanvas" class="visible"></canvas>

<div class="wrap">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The page you're looking for doesn't exist on Nocturne, or it may have been moved or removed.</p>
    <div class="path" id="reqPath">/</div>
    <div class="actions">
        <a class="btn primary" href="/">Go home</a>
        <button class="btn" id="backBtn">Go back</button>
    </div>
</div>

<nav id="dock"></nav>
<script src="/src/js/lr2815.js" defer></script>
<script src="/src/js/wz6714.js"></script>

<script>
(function () {
    const el = document.getElementById("reqPath");
    if (el) el.textContent = location.pathname + location.search;
    document.getElementById("backBtn").addEventListener("click", () => {
        if (history.length > 1) history.back();
        else location.href = "/";
    });
})();
</script>

<script src="/src/js/pu3927.js" defer></script>
</body>
</html>
