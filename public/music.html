<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#05060d">
    <meta name="robots" content="noindex">
    <title>nocturne</title>
    <style>html,body{background:#05060d;color:#eae6ff;margin:0}</style>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230b0a14'/><circle cx='16' cy='16' r='9' fill='%23c9c1ff'/><circle cx='21' cy='14' r='8' fill='%230b0a14'/></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/css/global.css">
    <link rel="stylesheet" href="/src/css/dock.css">
    <link rel="stylesheet" href="/src/css/music.css">
</head>
<body>

<canvas id="bgCanvas" class="visible"></canvas>

<div class="mu">
    <header class="mu-top">
        <div class="mu-brand">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            Music
        </div>
        <form class="mu-search" id="muSearchForm" autocomplete="off">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="muSearch" type="search" placeholder="Search songs, artists…" spellcheck="false">
        </form>
        <div class="mu-src" id="muSource" role="tablist" aria-label="Source">
            <button class="mu-src-btn on" data-src="ytmusic" title="YouTube Music — full-length songs">YT Music</button>
            <button class="mu-src-btn" data-src="deezer" title="Mainstream catalog — 30-second previews">Deezer</button>
            <button class="mu-src-btn" data-src="audius" title="Full-length tracks (indie / electronic)">Audius</button>
        </div>
        <div id="muAuth" class="mu-auth"></div>
    </header>

    <nav class="mu-tabs" id="muTabs">
        <button class="mu-tab active" data-view="foryou">For You</button>
        <button class="mu-tab" data-view="trending">Trending</button>
        <button class="mu-tab" data-view="favorites">Liked</button>
        <button class="mu-tab" data-view="history">History</button>
    </nav>

    <div class="mu-genres" id="muGenres"></div>

    <main class="mu-main">
        <div class="mu-headrow">
            <div>
                <h2 id="muHeading" class="mu-heading">For You</h2>
                <p id="muSub" class="mu-sub"></p>
            </div>
            <button id="muClearHist" class="mu-textbtn" hidden>Clear history</button>
        </div>
        <div id="muList" class="mu-list"></div>
        <div id="muState" class="mu-state"></div>
    </main>
</div>

<div class="mu-player" id="muPlayer" aria-hidden="true">
    <div class="mu-np">
        <div class="mu-np-art"><img id="muNpArt" alt=""></div>
        <div class="mu-np-meta">
            <div id="muNpTitle" class="mu-np-title">Nothing playing</div>
            <div id="muNpArtist" class="mu-np-artist">Pick a track to start</div>
        </div>
        <button id="muNpLike" class="mu-iconbtn mu-like" aria-label="Like">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.29 1.51 4.04 3 5.5l7 7Z"/></svg>
        </button>
    </div>

    <div class="mu-controls">
        <div class="mu-buttons">
            <button id="muShuffle" class="mu-iconbtn mu-small" aria-label="Shuffle"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg></button>
            <button id="muPrev" class="mu-iconbtn" aria-label="Previous"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5v14h2V5H6zm3.5 7 8.5 6V6l-8.5 6z"/></svg></button>
            <button id="muPlay" class="mu-play" aria-label="Play"></button>
            <button id="muNext" class="mu-iconbtn" aria-label="Next"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 5v14h2V5h-2zM6 18l8.5-6L6 6v12z"/></svg></button>
            <button id="muRepeat" class="mu-iconbtn mu-small" aria-label="Repeat"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg></button>
        </div>
        <div class="mu-seek">
            <span id="muCur" class="mu-time">0:00</span>
            <div class="mu-bar" id="muBar"><div class="mu-bar-buf" id="muBarBuf"></div><div class="mu-bar-fill" id="muBarFill"></div></div>
            <span id="muDur" class="mu-time">0:00</span>
        </div>
    </div>

    <div class="mu-extra">
        <button id="muMute" class="mu-iconbtn mu-small" aria-label="Mute"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M19 5a9 9 0 0 1 0 14"/></svg></button>
        <input id="muVol" class="mu-vol" type="range" min="0" max="100" value="100" aria-label="Volume">
    </div>
</div>

<audio id="muAudio" preload="metadata"></audio>

<nav id="dock"></nav>
<script src="/src/js/lr2815.js" defer></script>
<script src="/src/js/wz6714.js" defer></script>
<script src="/src/js/dm5108.js"></script>

<script src="/src/js/pu3927.js" defer></script>
</body>
</html>
