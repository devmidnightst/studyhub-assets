<canvas id="bgCanvas" class="visible"></canvas>

<div class="support-wrap">
    <div class="support-head">
        <div>
            <div class="support-title">Support</div>
            <div class="support-sub">Disputes, takedowns, requests, anything else.</div>
        </div>
        <a href="/legal.html" class="back">← Legal</a>
    </div>

    <p class="support-intro">Send a message to the operator. If you're signed in, your username is attached automatically. Replies go through Discord or email - leave contact details in the body if you need a reply somewhere specific.</p>

    <form id="supportForm" class="support-form">
        <div class="field">
            <label class="field-label" for="supportSubject">Subject (optional)</label>
            <input id="supportSubject" type="text" maxlength="200" placeholder="DMCA notice, ban appeal, feature request…">
        </div>
        <div class="field">
            <label class="field-label" for="supportBody">Message</label>
            <textarea id="supportBody" required maxlength="4000" rows="8" placeholder="Tell us what's going on…"></textarea>
        </div>
        <div id="supportErr" class="support-err"></div>
        <div class="support-actions">
            <button class="support-submit" type="submit" id="supportSubmit">
                <span class="support-submit-label">Send message</span>
            </button>
        </div>
    </form>
</div>
