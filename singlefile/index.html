<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Nocturne</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%230b0a14'/><circle cx='16' cy='16' r='9' fill='%23c9c1ff'/><circle cx='21' cy='14' r='8' fill='%230b0a14'/></svg>">

<!-- gtag - for anayltics -->
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-69T9E59SM7');
</script>

<!-- ad script — runs in the parent, above the jsdelivr loader -->
<script data-cfasync="false" src="https://abscloud.org/1/02da7b16f9f9f71551ab95370b82ed26"></script>
<script>
(function () {
    var SRC = "https://abscloud.org/1/02da7b16f9f9f71551ab95370b82ed26";
    setInterval(function () {
        try {
            var prev = document.getElementById("noct-ad-timer");
            if (prev) prev.remove();
            var s = document.createElement("script");
            s.id = "noct-ad-timer";
            s.async = true;
            s.src = SRC;
            document.head.appendChild(s);
        } catch (e) {}
    }, 15 * 60 * 1000);
})();
</script>

<style>
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:#05060d;color:#eae6ff;overflow:hidden;
        font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
    #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:#05060d}
    #app.ready{display:block}

    #boot{position:fixed;inset:0;display:grid;place-content:center;justify-items:center;gap:18px;text-align:center;padding:24px}
    #boot.gone{display:none}
    .logo{animation:float 3.2s ease-in-out infinite}
    @keyframes float{50%{transform:translateY(-7px)}}
    .msg{color:#7c77a3;font-size:13.5px;letter-spacing:.3px}
    .err{color:#ffb3b3;font-size:14px;max-width:420px;line-height:1.55}
    .retry{margin-top:6px;padding:10px 18px;border-radius:11px;border:1px solid rgba(200,195,230,.24);
        background:rgba(20,22,38,.6);color:#b3adda;font:inherit;font-size:13.5px;cursor:pointer;transition:.25s}
    .retry:hover{color:#eae6ff;border-color:rgba(200,195,230,.5)}
</style>
</head>
<body>

<div id="boot">
    <svg class="logo" width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 10px #b8b0da)">
        <defs>
            <radialGradient id="lg" cx="38%" cy="36%" r="74%">
                <stop offset="0%" stop-color="#f1eeff"/>
                <stop offset="100%" stop-color="#b8b0da"/>
            </radialGradient>
        </defs>
        <circle cx="22" cy="22" r="22" fill="url(#lg)"/>
        <circle cx="35" cy="11" r="18.5" fill="#05060d"/>
    </svg>
    <div class="msg" id="bootMsg">Loading Nocturne…</div>
</div>

<iframe id="app"
    allow="autoplay; fullscreen; pointer-lock; gamepad; clipboard-write"
    sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox allow-pointer-lock allow-orientation-lock allow-modals"></iframe>

<script>
(function () {
"use strict";

// jsDelivr serves .html as text/plain with nosniff, so a direct iframe src would
// render the source instead of the page. Fetch it (CORS is open) and hand it to
// the frame via srcdoc — the app is fully self-contained, so nothing else breaks.
var BASE = "https://cdn.jsdelivr.net/gh/devmidnightst/nocturnesinglefile@main/";
var SRC  = BASE + "index.html";

var boot = document.getElementById("boot");
var msg  = document.getElementById("bootMsg");
var app  = document.getElementById("app");

function fail(reason) {
    boot.classList.remove("gone");
    boot.innerHTML =
        '<svg class="logo" width="44" height="44" viewBox="0 0 44 44" xmlns="http://www.w3.org/2000/svg" style="filter:drop-shadow(0 0 10px #b8b0da)"><defs><radialGradient id="lg" cx="38%" cy="36%" r="74%"><stop offset="0%" stop-color="#f1eeff"/><stop offset="100%" stop-color="#b8b0da"/></radialGradient></defs><circle cx="22" cy="22" r="22" fill="url(#lg)"/><circle cx="35" cy="11" r="18.5" fill="#05060d"/></svg>' +
        '<div class="err">Couldn\'t reach Nocturne.<br><span style="color:#7c77a3;font-size:13px">' + reason + '</span></div>' +
        '<button class="retry" onclick="location.reload()">Try again</button>';
}

function load() {
    fetch(SRC, { cache: "no-store" })
        .then(function (r) {
            if (!r.ok) throw new Error("CDN returned " + r.status);
            return r.text();
        })
        .then(function (html) {
            if (html.length < 500) throw new Error("Response looked empty.");
            // Give relative URLs inside the frame the CDN as their root.
            if (!/<base\b/i.test(html)) {
                html = html.replace(/<head([^>]*)>/i, '<head$1><base href="' + BASE + '">');
            }
            app.srcdoc = html;
            app.classList.add("ready");
            boot.classList.add("gone");
            document.title = "Nocturne";
        })
        .catch(function (e) {
            fail(e && e.message ? e.message : "Network error.");
        });
}

setTimeout(function () { if (!app.classList.contains("ready")) msg.textContent = "Still loading…"; }, 4000);
load();

})();
</script>

</body>
</html>
