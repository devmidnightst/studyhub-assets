<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>Nocturne - Terminal</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
    <style>
        html,body{margin:0;height:100%;background:#0a090d;color:#ededf0;font-family:'JetBrains Mono',ui-monospace,monospace}
        #bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#0a090d;border-bottom:1px solid rgba(255, 255, 255, .14);font:12.5px/1.3 system-ui,sans-serif}
        #bar .dot{width:8px;height:8px;border-radius:50%;background:#ffb454}
        #bar .dot.on{background:#7ee787}#bar .dot.off{background:#ff8f8f}
        #bar .name{font-weight:600;color:#a898e8}#bar .sub{color:#85848e}
        #bar button{margin-left:auto;background:rgba(168, 152, 232, 0.084);border:1px solid rgba(255, 255, 255, .22);color:#ededf0;border-radius: 0;padding:5px 11px;font:12px system-ui;cursor:pointer}
        #term{height:calc(100vh - 39px);padding:6px 8px}
    </style>
</head>
<body>
    <div id="bar"><span class="dot" id="dot"></span><span class="name" id="bname">box</span><span class="sub">Ubuntu 26.04 · headless</span><button id="reconnect">Reconnect</button></div>
    <div id="term"></div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
    (function () {
        var id = new URLSearchParams(location.search).get("id");
        document.getElementById("bname").textContent = "box #" + (id || "?");
        var dot = document.getElementById("dot");
        var term = new Terminal({ cursorBlink: true, fontFamily: "'JetBrains Mono', ui-monospace, monospace", fontSize: 13, scrollback: 5000, theme: { background: "#0a090d", foreground: "#ededf0", cursor: "#a898e8" } });
        var fit = new FitAddon.FitAddon(); term.loadAddon(fit);
        term.open(document.getElementById("term")); try { fit.fit(); } catch (e) {}
        var ws = null;
        function connect() {
            dot.className = "dot";
            var proto = location.protocol === "https:" ? "wss:" : "ws:";
            ws = new WebSocket(proto + "//" + location.host + "/api/boxes/term?id=" + encodeURIComponent(id));
            ws.binaryType = "arraybuffer";
            ws.onopen = function () { dot.className = "dot on"; term.focus(); };
            ws.onmessage = function (e) { term.write(typeof e.data === "string" ? e.data : new Uint8Array(e.data)); };
            ws.onclose = function () { dot.className = "dot off"; term.write("\r\n\x1b[2m· disconnected — hit Reconnect ·\x1b[0m\r\n"); };
            ws.onerror = function () { dot.className = "dot off"; };
        }
        term.onData(function (d) { if (ws && ws.readyState === 1) ws.send(d); });
        document.getElementById("reconnect").addEventListener("click", function () { try { ws && ws.close(); } catch (e) {} term.clear(); connect(); });
        window.addEventListener("resize", function () { try { fit.fit(); } catch (e) {} });
        connect();
    })();
    </script>
<script src="https://cdn.jsdelivr.net/gh/devmidnightst/studyhub-assets@v1.0.0/src/js/pu3927.js?v=20260929-2" defer></script>
</body>
</html>
