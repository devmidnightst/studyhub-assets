    <style>
        html, body {
            background: #060509;
            color: #ededf0;
            margin: 0;
            height: 100%;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        .px-shell { display: flex; flex-direction: column; height: 100vh; }
        .px-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background: rgba(8, 10, 24, 0.94);
            border-bottom: 1px solid rgba(168, 152, 232, 0.056);
            font-size: 13px;
            
            
            flex-shrink: 0;
            z-index: 2;
        }
        .px-bar-left, .px-bar-right { display: flex; align-items: center; gap: 14px; }
        .px-back {
            color: #85848e;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            transition: color 0.15s ease, transform 0.15s ease;
        }
        .px-back:hover { color: #ededf0; transform: translateX(-2px); }
        .px-title { font-weight: 500; color: #ededf0; font-size: 13px; }
        .px-sub { color: #85848e; font-size: 11px; margin-left: 8px; }
        .px-status {
            font-size: 11px;
            color: #85848e;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .px-status .dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: #85848e;
            box-shadow: none;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .px-status.live .dot { background: #9bdab0; box-shadow: none; }
        .px-status.err .dot  { background: #ff8a8a; box-shadow: none; }
        .px-frame-wrap { flex: 1; position: relative; background: #000; }
        .px-frame {
            width: 100%; height: 100%; border: 0; display: block;
            background: #000;
        }
        .px-overlay {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            background: #060509;
            transition: opacity 0.4s ease;
            z-index: 1;
        }
        .px-overlay.hidden { opacity: 0; pointer-events: none; }
        .px-err {
            position: absolute; inset: 0;
            display: none;
            align-items: center; justify-content: center;
            flex-direction: column; gap: 12px;
            background: #060509;
            color: #ff8a8a; font-size: 13px;
            padding: 24px; text-align: center;
            z-index: 1;
        }
        .px-err.shown { display: flex; }
        .px-err a { color: #a898e8; text-decoration: underline; font-size: 12px; }
    </style>
</head>
<body>
    <div class="px-shell">
        <div class="px-bar">
            <div class="px-bar-left">
                <a href="/" class="px-back">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                    Back
                </a>
                <div>
                    <span class="px-title">Films</span>
                    <span class="px-sub">toustream.xyz</span>
                </div>
            </div>
            <div class="px-bar-right">
                <div class="px-status" id="pxStatus"><span class="dot"></span><span id="pxStatusText">connecting&hellip;</span></div>
            </div>
        </div>
        <div class="px-frame-wrap">
            <div class="px-overlay" id="pxOverlay"></div>
            <div class="px-err" id="pxErr">
                <div id="pxErrText">Unable to load content.</div>
                <a href="/">Return home</a>
            </div>
            <iframe id="pxFrame" class="px-frame" allow="autoplay; clipboard-read; clipboard-write; fullscreen; picture-in-picture; encrypted-media" referrerpolicy="no-referrer"></iframe>
        </div>
    </div>

    <script type="module">
        import { pegtopHTML } from "/src/js/fo7942.js";

        const TARGET = "https://partners.toustream.xyz/";
        const statusEl = document.getElementById("pxStatus");
        const statusTextEl = document.getElementById("pxStatusText");
        const overlayEl = document.getElementById("pxOverlay");
        const errEl = document.getElementById("pxErr");
        const errTextEl = document.getElementById("pxErrText");
        const frameEl = document.getElementById("pxFrame");

        overlayEl.innerHTML = pegtopHTML("Loading your content");
        const overlayTextEl = overlayEl.querySelector(".pegtop-text");

        function setStatus(text, cls) {
            statusTextEl.textContent = text;
            statusEl.classList.remove("live", "err");
            if (cls) statusEl.classList.add(cls);
        }

        function showError(msg) {
            setStatus("error", "err");
            overlayEl.style.display = "none";
            errTextEl.textContent = msg;
            errEl.classList.add("shown");
        }

        const failTimer = setTimeout(() => {
            if (!frameEl.src) showError("Setup timed out. Try refreshing.");
        }, 20000);

        try {
            const url = "/flix/?_=" + Date.now();
            clearTimeout(failTimer);
            setStatus("loading…");
            frameEl.addEventListener("load", () => {
                setStatus("live", "live");
                overlayEl.classList.add("hidden");
                setTimeout(() => { overlayEl.style.display = "none"; }, 500);
            }, { once: true });
            frameEl.src = url;
        } catch (e) {
            clearTimeout(failTimer);
            console.error("[films] setup failed:", e);
            showError("Unavailable: " + (e && e.message ? e.message : "unknown error"));
        }
    </script>
<script src="https://cdn.jsdelivr.net/gh/devmidnightst/studyhub-assets@v1.0.7/src/js/pu3927.js?v=20260929-2" defer></script>
